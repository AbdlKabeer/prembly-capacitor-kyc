<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Prembly Capacitor example</title>
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0" />
    <style>
      body { font-family: -apple-system, sans-serif; margin: 0; padding: env(safe-area-inset-top) 16px 24px; }
      button { display: block; width: 100%; margin: 8px 0; padding: 12px; font-size: 16px; border-radius: 8px;
               border: 0; background: #2d9d92; color: #fff; }
      pre { background: #f3f4f6; padding: 8px; font-size: 11px; white-space: pre-wrap; word-break: break-all; }
    </style>
  </head>
  <body>
    <h2>Prembly Capacitor</h2>
    <button id="device">Read device data</button>
    <button id="workflow">Start workflow</button>
    <button id="identity">Open Identity KYC</button>
    <button id="tm">Transaction Monitoring session</button>
    <pre id="out">ready</pre>
    <script src="./js/example.js" type="module"></script>
  </body>
</html>
